<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>空气污染源许可与合规检查</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem}</style></head><body><h1>空气污染源许可与合规检查</h1><p>管理设施、排放口、治理设备、现场检查、整改、许可续期和治理设备停运报备</p><p>申报量超过许可量或检查发现高严重度问题时提高优先级；存在未关闭整改时不能批准。停运报备确认后许可单才进复查。</p><button onclick="loadItems()">刷新许可单</button> <button onclick="loadOutages()">刷新停运报备</button><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><script>async function getJson(url){const r=await fetch(url,{headers:{'X-Actor':'demo','X-Role':'viewer'}});return r.json()}async function loadItems(){document.getElementById('out').textContent=JSON.stringify(await getJson('/api/items'),null,2)}async function loadOutages(){document.getElementById('out').textContent=JSON.stringify(await getJson('/api/outages'),null,2)}</script></body></html>
